  <noscript>Você precisa habilitar JavaScript para executar este app.</noscript>
  <div id="root"></div>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('✅ SW registered successfully:', registration.scope);
          })
          .catch(function(registrationError) {
            console.log('❌ SW registration failed:', registrationError);
          });
      });
    }
    
    // Debug PWA
    console.log('🔍 PWA Debug - Checking conditions...');
    console.log('User Agent:', navigator.userAgent);
    console.log('Is HTTPS:', location.protocol === 'https:');
    console.log('Has Service Worker:', 'serviceWorker' in navigator);
    console.log('Display Mode:', window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser');
    
    // Forçar evento beforeinstallprompt para teste (apenas desenvolvimento)
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      setTimeout(() => {
        console.log('🧪 Simulando beforeinstallprompt para desenvolvimento...');
        window.dispatchEvent(new Event('beforeinstallprompt'));
      }, 3000);
    }
  </script>
